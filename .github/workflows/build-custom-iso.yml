# Prepared and maintained by Berkay Yetgin
name: Build Custom Omarchy ISO

on:
  push:
    branches:
      - quattro
    paths:
      - ".github/workflows/build-custom-iso.yml"
  workflow_dispatch:
    inputs:
      commit:
        description: "omacom/omarchy Commit SHA or Branch"
        required: true
        default: "002c70a5442a300c6bb22b687d1726e83da5ca44"

# Only the newest ISO build matters. A newer build cancels an older one that is
# still running so we do not waste Actions minutes or storage.
concurrency:
  group: omarchy-iso-latest
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      OMARCHY_COMMIT: ${{ github.event.inputs.commit || '002c70a5442a300c6bb22b687d1726e83da5ca44' }}
    steps:
      - name: Checkout omarchy-iso
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout omacom/omarchy
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: ${{ env.OMARCHY_COMMIT }}
          path: omarchy-source
          fetch-depth: 0

      - name: Checkout omacom-io/omarchy-pkgs
        uses: actions/checkout@v4
        with:
          repository: omacom-io/omarchy-pkgs
          path: omarchy-pkgs
          fetch-depth: 0

      - name: Verify Omarchy Commit Info
        run: |
          echo "=========================================="
          echo "Building ISO with exact omacom/omarchy commit: $OMARCHY_COMMIT"
          git -C omarchy-source log -1 --stat
          echo "=========================================="

      - name: Build ISO
        run: |
          NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --edge --local-source "$(pwd)/omarchy-source" "$(pwd)/omarchy-pkgs"

      - name: Prepare Release Assets & Checksums
        run: |
          cd ./release
          echo "=== Generating SHA256 Checksums for original ISO ==="
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

          # GitHub Release assets enforce a strict 2 GiB (2,147,483,648 bytes) limit per file.
          # If an ISO exceeds 2000MB (~1.95 GiB), archive it into 1900MB multi-volume 7z parts (.7z.001, .7z.002...)
          # with store mode (-mx0) for instant extraction via WinRAR / 7-Zip.
          SPLIT_THRESHOLD_BYTES=$((2000 * 1024 * 1024))
          for iso in *.iso; do
            [ -f "$iso" ] || continue
            size=$(stat -c%s "$iso")
            if [ "$size" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
              echo "File $iso ($size bytes) exceeds GitHub Release asset limit (2 GiB)."
              echo "Creating 1900MB multi-volume 7z archive..."
              7z a -v1900m -mx0 "${iso%.iso}.7z" "$iso"
              echo "Generated multi-volume parts:"
              ls -lh "${iso%.iso}.7z."*
              echo "" >> SHA256SUMS
              echo "# 7-Zip Multi-volume Archive Parts:" >> SHA256SUMS
              sha256sum "${iso%.iso}.7z."* >> SHA256SUMS
              rm -f "$iso"
            fi
          done

          echo "=== Final Assets in ./release ==="
          ls -lh
          echo "=== Final SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.OMARCHY_COMMIT }}-${{ github.run_number }}
          name: "Omarchy ISO - Commit ${{ env.OMARCHY_COMMIT }}"
          body: |
            ### Custom Omarchy ISO Build
            - **Omarchy Commit:** `${{ env.OMARCHY_COMMIT }}`
            - **Build Run:** `${{ github.run_number }}`

            ---

            ### 📥 Download & Extraction Instructions

            Due to GitHub Releases 2 GiB per-asset file size limit, large ISOs are packaged as multi-volume 7z archives (`.7z.001`, `.7z.002`, ...).

            #### 🪟 Windows (WinRAR / 7-Zip / NanaZip)
            1. Download all `.7z.00*` parts and `SHA256SUMS` into the same folder.
            2. Right-click on the `.7z.001` file and select **"Extract Here" (Buraya Çıkart)** or open with WinRAR / 7-Zip.
            3. WinRAR / 7-Zip will automatically merge all parts and extract the full `.iso` file.

            #### 🐧 Linux / 🍎 macOS
            ```bash
            # Download all parts and extract the ISO:
            7z x *.7z.001

            # Verify integrity against the original ISO:
            sha256sum -c SHA256SUMS
            ```
          files: |
            ./release/*
          draft: false
          prerelease: false

      - name: Upload newly built ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-iso-${{ env.OMARCHY_COMMIT }}-${{ github.run_number }}
          path: ./release/*
          retention-days: 1

      - name: Cleanup old releases, tags, artifacts and workflow runs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_TAG: build-${{ env.OMARCHY_COMMIT }}-${{ github.run_number }}
        run: |
          set -uo pipefail

          echo "=== Keeping only current release: $CURRENT_TAG ==="
          mapfile -t release_tags < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name'
          )
          for tag in "${release_tags[@]}"; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          echo "=== Removing leftover old build tags ==="
          mapfile -t build_refs < <(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/build-" \
              --jq '.[].ref' 2>/dev/null || true
          )
          for ref in "${build_refs[@]}"; do
            tag="${ref#refs/tags/}"
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old build tag: $tag"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
            fi
          done

          echo "=== Removing artifacts from every older run ==="
          mapfile -t old_artifact_ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.workflow_run.id != $CURRENT_RUN_ID) | .id"
          )
          for artifact_id in "${old_artifact_ids[@]}"; do
            echo "Deleting old artifact: $artifact_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done

          echo "=== Removing every older Actions workflow run ==="
          mapfile -t old_run_ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID) | .id"
          )
          for run_id in "${old_run_ids[@]}"; do
            echo "Deleting old workflow run: $run_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done

          echo "=== Cleanup complete ==="
          echo "Kept release/tag: $CURRENT_TAG"
          echo "Kept workflow run: $CURRENT_RUN_ID"
